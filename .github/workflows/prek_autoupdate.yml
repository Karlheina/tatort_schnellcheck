name: Prek autoupdate

on:
  push:
    branches:
      - add_pre_commit
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Run prek autoupdate
        run: uvx prek autoupdate

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(prek): autoupdate hooks"
          title: "chore(prek): autoupdate hooks"
          body: |
            Automated update of prek hooks.
          branch: prek-autoupdate
          delete-branch: true

